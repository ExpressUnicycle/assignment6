<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf</title>
  </head>
  <body>

    <button id="sortTitle">Sort by Title</button>
    <button id="sortPages">Sort by Pages</button>
    <button id="sortYear">Sort by Year</button>
    
    <select id="select">
      <option value="all">All</option>
      <option value="Thriller">Thriller</option>
      <option value="Fantasy">Fantasy</option>
      <option value="Science Fiction">Science Fiction</option>
      <option value="under-450">Under 450 pages</option>
      <option value="after-2000">Published after 2000</option>
    </select>

    <button id="submit">Submit</button>


    <div id="wrapper"></div>

    <script src="index.js"></script>
  </body>
</html>
